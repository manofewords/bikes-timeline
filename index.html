<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike timeline</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="viz-root">
  <header>
    <h1>Bike timeline</h1>
  </header>

  <div class="controls">
    <label>Zoom <input type="range" id="zoom-slider" min="28" max="200" value="64"></label>
    <div class="control-buttons">
      <button class="button" id="import-json-button">Import</button><input type="file" id="json-file-input" accept="application/json,.json">
      <button class="button" id="export-json-button">Export</button>
      <button class="button icon-button" id="build-settings-button" title="Build settings" aria-label="Build settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </div>

  <details class="chart-option-section" id="timeline-legend-section" open>
    <summary>Timeline legend</summary>
    <div class="part-group-legend" id="part-group-legend"></div>
  </details>
  <details class="chart-option-section" id="shown-bikes-section" open>
    <summary>Shown bikes</summary>
    <div class="bike-toggles" id="bike-toggles"></div>
  </details>

  <details class="data-errors" id="data-errors" open hidden>
    <summary id="data-errors-summary"></summary>
    <p id="data-errors-note"></p>
    <ul id="data-errors-list"></ul>
  </details>

  <div class="chart-container" id="chart-container"></div>

  <details id="parts-table-details">
    <summary>All parts (table view)</summary>
    <div class="parts-table-scroller"><table class="parts-table" id="parts-table"></table></div>
  </details>
  <div class="tooltip" id="tooltip"></div>
  <dialog class="settings-dialog" id="build-settings-dialog" aria-labelledby="build-settings-title">
    <form method="dialog">
      <div class="settings-dialog-header">
        <div>
          <h2 id="build-settings-title">Build settings</h2>
          <p>Which parts a bike needs to count as built. Mandatory and optional parts get a lane on the bike timeline; ignored parts are not shown. Changes apply when you close this dialog.</p>
        </div>
        <button class="button icon-button" value="close" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="settings-sections" id="build-settings-sections"></div>
      <div class="settings-dialog-footer"><button class="button" value="done">Done</button></div>
    </form>
  </dialog>
</div>
<script src="utils.js"></script>
<script src="timeline.js"></script>
</body>
</html>

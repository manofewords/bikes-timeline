<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bike timeline tests</title>
    <style>
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        margin: 24px;
        color: #1d1d1f;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      #summary {
        font-weight: 600;
        margin: 0 0 12px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        padding: 2px 0;
      }
      .pass {
        color: #1a7f37;
      }
      .fail {
        color: #cf222e;
      }
      pre {
        margin: 2px 0 6px 18px;
        white-space: pre-wrap;
        color: #1d1d1f;
        background: #fff1f0;
        padding: 4px 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Bike timeline tests</h1>
    <p id="summary">Running…</p>
    <ul id="results"></ul>
    <script src="utils.js"></script>
    <script src="test.js"></script>
  </body>
</html>
